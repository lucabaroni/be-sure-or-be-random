      ab_pairs_variant: neutral
      matrix:
        models:
        - Qwen/Qwen3.5-27B
        - Qwen/Qwen3-32B
        - meta-llama/Meta-Llama-3-70B-Instruct
        vector_source:
        - - Be sure!
          - Be random!
        test_pairs:
        - - Commit to one option
          - Keep both options equally likely
        strengths:
        - 2.0
        - 1.0
        - -1.0
        - -2.0
    - id: no-instruction-control
      kind: no_instruction
      ab_pairs_variant: neutral
      matrix:
        models:
        - Qwen/Qwen3-32B
        - Qwen/Qwen3.5-27B
        - meta-llama/Meta-Llama-3-70B-Instruct
        fixed_layer_overrides:
          Qwen/Qwen3-32B: 56
          Qwen/Qwen3.5-27B: 56
