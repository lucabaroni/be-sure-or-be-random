# Run matrix for every experiment in the paper. Launch with: python run_paper.py run --group <id>
# models/Qwen3-14B-calib-soft is Qwen3-14B after Calibration Fine-Tuning (soft-target variant, default settings,
# LoRA merged), trained with https://github.com/chandar-lab/calibration-finetuning (not included here).
version: 1
defaults:
  supported_stages:
  - prepare
  - run
figures:
  figure3:
    title: Cross-model comparison
    groups:
    - id: local-model-sweep
      kind: zero_shot_local
      ab_pairs_variant: neutral
      matrix:
        models:
        - qwen/Qwen3-0.6B
        - qwen/Qwen3-1.7B
        - qwen/Qwen3-4B
        - qwen/Qwen3-8B
        - qwen/Qwen3-14B
        - qwen/Qwen3-32B
        - qwen/Qwen3.5-0.8B
        - qwen/Qwen3.5-2B
        - qwen/Qwen3.5-4B
        - qwen/Qwen3.5-9B
        - qwen/Qwen3.5-27B
        - qwen/Qwen3.5-35B-A3B
        - meta-llama/Meta-Llama-3-8B-Instruct
        - meta-llama/Meta-Llama-3-70B-Instruct
        - google/gemma-4-26B-A4B-it
        - google/gemma-4-31B-it
        - allenai/Olmo-3.1-32B-Instruct-SFT
        - allenai/Olmo-3.1-32B-Instruct-DPO
        - allenai/Olmo-3.1-32B-Instruct
        instruction_pairs:
        - - Be sure!
          - Be random!
        - - Maximize certainty
          - Minimize certainty
        - - Maximize certainty
          - Maximize uncertainty
        - - Commit to one option
          - Keep both options equally likely
        - - Reply with confidence
          - Reply without confidence
        - - Aim for low entropy
          - Aim for high entropy
        - - Be deterministic
          - Assign equal probability to both options
    - id: calibration-ft-qwen3-14b
      kind: zero_shot_local
      ab_pairs_variant: neutral
      matrix:
        models:
        - models/Qwen3-14B-calib-soft
        instruction_pairs:
        - - Be sure!
          - Be random!
        - - Maximize certainty
          - Minimize certainty
        - - Maximize certainty
          - Maximize uncertainty
        - - Commit to one option
          - Keep both options equally likely
        - - Reply with confidence
          - Reply without confidence
        - - Aim for low entropy
          - Aim for high entropy
        - - Be deterministic
          - Assign equal probability to both options
    - id: local-model-sweep-barebone
      kind: prompt_variants
      ab_pairs_variant: neutral
      matrix:
        models:
        - qwen/Qwen3-0.6B
        - qwen/Qwen3-1.7B
        - qwen/Qwen3-4B
        - qwen/Qwen3-8B
        - qwen/Qwen3-14B
        - qwen/Qwen3-32B
        - qwen/Qwen3.5-0.8B
        - qwen/Qwen3.5-2B
        - qwen/Qwen3.5-4B
        - qwen/Qwen3.5-9B
        - qwen/Qwen3.5-27B
        - qwen/Qwen3.5-35B-A3B
        - meta-llama/Meta-Llama-3-8B-Instruct
        - meta-llama/Meta-Llama-3-70B-Instruct
        - google/gemma-4-26B-A4B-it
        - google/gemma-4-31B-it
        - allenai/Olmo-3.1-32B-Instruct-SFT
        - allenai/Olmo-3.1-32B-Instruct-DPO
        - allenai/Olmo-3.1-32B-Instruct
        templates:
        - barebone
        instruction_pairs:
        - - Be sure!
          - Be random!
        - - Maximize certainty
          - Minimize certainty
        - - Maximize certainty
          - Maximize uncertainty
        - - Commit to one option
          - Keep both options equally likely
        - - Reply with confidence
          - Reply without confidence
        - - Aim for low entropy
          - Aim for high entropy
        - - Be deterministic
          - Assign equal probability to both options
    - id: api-model-sweep
      kind: zero_shot_api
      matrix:
        models:
        - accounts/fireworks/models/deepseek-v3p1
        - accounts/fireworks/models/deepseek-v3p2
        - accounts/fireworks/models/glm-4p7
        - accounts/fireworks/models/glm-5
        - accounts/fireworks/models/llama-v3p3-70b-instruct
        instruction_pairs:
        - - Be sure!
          - Be random!
        - - Maximize certainty
          - Minimize certainty
        - - Maximize certainty
          - Maximize uncertainty
        - - Commit to one option
          - Keep both options equally likely
        - - Reply with confidence
          - Reply without confidence
        - - Aim for low entropy
          - Aim for high entropy
        - - Be deterministic
          - Assign equal probability to both options
  figure4:
