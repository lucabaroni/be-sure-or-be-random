  figure7:
    title: MMLU entropy steering
    groups:
    - id: mmlu-entropy-steering
      kind: mmlu_entropy_steering
      ab_pairs_variant: neutral
      matrix:
        models:
        - Qwen/Qwen3.5-27B
        - Qwen/Qwen3-32B
        dataset_name: cais/mmlu
        dataset_config: all
        split: test
        max_examples: null
        batch_size: 16
        fixed_layer_overrides:
          Qwen/Qwen3.5-27B: 56
          Qwen/Qwen3-32B: 56
        vector_source:
        - - Be sure!
          - Be random!
        strengths:
        - 2.0
        steering_conditions:
        - none
        - increase_entropy
        - decrease_entropy
        prompt_variant: format_instructed
    - id: mmlu-random-vector-control
      kind: mmlu_random_vector_control
      ab_pairs_variant: neutral
      matrix:
        models:
        - Qwen/Qwen3.5-27B
        - Qwen/Qwen3-32B
        dataset_name: cais/mmlu
        dataset_config: all
        split: test
        max_examples: null
        batch_size: 16
        fixed_layer_overrides:
          Qwen/Qwen3.5-27B: 56
          Qwen/Qwen3-32B: 56
        vector_source:
        - - Be sure!
          - Be random!
        strengths:
        - 2.0
        n_random_vectors: 8
        random_seed: 0
        prompt_variant: format_instructed
    - id: mmlu-prompt-conditions
      kind: mmlu_prompt_conditions
      ab_pairs_variant: neutral
      matrix:
        models:
        - qwen/Qwen3.5-27B
        - meta-llama/Meta-Llama-3-8B-Instruct
        dataset_name: cais/mmlu
        dataset_config: all
        split: test
        max_examples: null
        batch_size: 32
        answer_prefix: 'ANSWER:'
        prompt_variants:
        - format_instructed
        - maximize_certainty
        - maximize_entropy
        - sandbag_via_uncertainty
    - id: mmlu-steering-vector-probe
      kind: mmlu_steering_vector_probe
      ab_pairs_variant: neutral
      matrix:
        models:
        - Qwen/Qwen3.5-27B
        dataset_name: cais/mmlu
        dataset_config: all
        split: test
        max_examples: null
        batch_size: 16
        answer_prefix: 'ANSWER:'
        prompt_variants:
        - format_instructed
        - maximize_entropy
        positive_variant: format_instructed
        negative_variant: maximize_entropy
        vector_source:
        - - Be sure!
          - Be random!
        layer_step: 4
        val_fraction: 0.2
        seed: 0
  figure5:
    title: Steering and no-instruction control
    groups:
    - id: steering-extract
      kind: steering_extract
      ab_pairs_variant: neutral
      matrix:
        models:
        - Qwen/Qwen3-32B
        - Qwen/Qwen3.5-27B
        - meta-llama/Meta-Llama-3-70B-Instruct
        instruction_pairs:
        - - Be sure!
          - Be random!
        - - Maximize certainty
          - Minimize certainty
        - - Maximize certainty
          - Maximize uncertainty
        - - Commit to one option
          - Keep both options equally likely
        - - Reply with confidence
          - Reply without confidence
        - - Aim for low entropy
          - Aim for high entropy
        - - Be deterministic
          - Assign equal probability to both options
        layer_step: 4
    - id: steering-compute
      kind: steering_compute
      ab_pairs_variant: neutral
    - id: steering-all-layers
      kind: steering_all_layers
      ab_pairs_variant: neutral
      matrix:
        models:
        - Qwen/Qwen3-32B
        - Qwen/Qwen3.5-27B
        - meta-llama/Meta-Llama-3-70B-Instruct
        vector_source:
